<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}" />
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="nav">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/projects/' | relative_url }}">Projects</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a class="button button-outline" href="{{ '/resume/' | relative_url }}">CV</a>
          <button class="theme-toggle" type="button" aria-label="Toggle dark mode" data-theme-toggle>
            <span class="toggle-icon toggle-sun" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <circle cx="12" cy="12" r="4.5"></circle>
                <line x1="12" y1="2.5" x2="12" y2="5"></line>
                <line x1="12" y1="19" x2="12" y2="21.5"></line>
                <line x1="2.5" y1="12" x2="5" y2="12"></line>
                <line x1="19" y1="12" x2="21.5" y2="12"></line>
                <line x1="5.2" y1="5.2" x2="7" y2="7"></line>
                <line x1="17" y1="17" x2="18.8" y2="18.8"></line>
                <line x1="17" y1="7" x2="18.8" y2="5.2"></line>
                <line x1="5.2" y1="18.8" x2="7" y2="17"></line>
              </svg>
            </span>
            <span class="toggle-icon toggle-moon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M21 15.5a8.5 8.5 0 0 1-11.3-11.3 1 1 0 0 0-1.3-1.3A10.5 10.5 0 1 0 22.3 16.8 1 1 0 0 0 21 15.5z"/>
              </svg>
            </span>
          </button>
        </nav>
      </div>
    </header>

    <main class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-copy">
          <p class="footer-source">Website inspired by <a href="https://github.com/shunzh/project_website/tree/main">shunzh</a></p>
        </div>
        <div class="footer-actions">
          <a class="button icon-button" href="https://github.com/{{ site.github_username }}" target="_blank" rel="noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 2C6.48 2 2 6.58 2 12.26c0 4.5 2.87 8.31 6.84 9.66.5.1.68-.22.68-.48 0-.24-.01-.88-.01-1.73-2.78.62-3.36-1.38-3.36-1.38-.46-1.18-1.11-1.5-1.11-1.5-.9-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.55 2.34 1.1 2.91.84.09-.66.35-1.1.64-1.36-2.22-.26-4.56-1.13-4.56-5 0-1.1.39-2 1.03-2.71-.1-.26-.45-1.3.1-2.7 0 0 .84-.27 2.75 1.03.8-.23 1.66-.34 2.51-.34.85 0 1.71.12 2.51.34 1.9-1.3 2.75-1.03 2.75-1.03.55 1.4.2 2.44.1 2.7.64.71 1.02 1.62 1.02 2.71 0 3.88-2.35 4.74-4.58 4.99.36.32.69.96.69 1.93 0 1.4-.01 2.53-.01 2.87 0 .27.18.59.69.48 3.97-1.35 6.84-5.16 6.84-9.66C22 6.58 17.52 2 12 2z"/>
            </svg>
            GitHub
          </a>
          <a class="button button-outline icon-button" href="https://www.linkedin.com/in/{{ site.linkedin_username }}/" target="_blank" rel="noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M20.45 20.45h-3.56v-5.58c0-1.33-.02-3.05-1.86-3.05-1.86 0-2.14 1.45-2.14 2.95v5.68H9.33V9h3.4v1.56h.05c.47-.89 1.62-1.83 3.34-1.83 3.57 0 4.23 2.35 4.23 5.41v6.31zM5.34 7.44a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.12 20.45H3.55V9h3.57v11.45zM22.23 2H1.77C.8 2 0 2.77 0 3.72v16.56C0 21.23.8 22 1.77 22h20.46c.98 0 1.77-.77 1.77-1.72V3.72C24 2.77 23.21 2 22.23 2z"/>
            </svg>
            LinkedIn
          </a>
        </div>
      </div>
    </footer>
    <script>
      (function () {
        var root = document.documentElement;
        var toggle = document.querySelector("[data-theme-toggle]");
        var themeImages = document.querySelectorAll("[data-theme-img]");
        if (!toggle) return;
        function applyTheme(mode) {
          root.setAttribute("data-theme", mode);
          toggle.setAttribute("aria-pressed", String(mode === "dark"));
          themeImages.forEach(function (img) {
            var light = img.getAttribute("data-light");
            var dark = img.getAttribute("data-dark");
            img.src = mode === "dark" ? dark || light : light || dark;
          });
        }
        var stored = localStorage.getItem("theme");
        if (stored === "dark" || stored === "light") {
          applyTheme(stored);
        }
        toggle.addEventListener("click", function () {
          var isDark = root.getAttribute("data-theme") === "dark";
          var next = isDark ? "light" : "dark";
          applyTheme(next);
          localStorage.setItem("theme", next);
        });
      })();
    </script>
  </body>
</html>
